<!DOCTYPE html>
<html lang="it" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hub</title>
<meta name="description" content="I miei servizi personali. Tutti i dati restano sul dispositivo.">
<meta name="theme-color" content="#f2f4f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0f1a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hub">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/bilancio.css">
<link rel="stylesheet" href="css/calendario.css">
</head>
<body>

<!-- ══════════════════════════════ SCHERMATA DI BLOCCO ══════════════════════════════ -->
<div id="lock" class="lock">
  <div class="lock-inner">
    <div class="lock-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2.6"/><rect x="13" y="3" width="8" height="8" rx="2.6"/><rect x="3" y="13" width="8" height="8" rx="2.6"/><rect x="13" y="13" width="8" height="8" rx="2.6"/></svg>
    </div>
    <h1 class="lock-title">Hub</h1>
    <p class="lock-msg" id="lockMsg" role="status" aria-live="polite">Inserisci il PIN</p>

    <div class="dots" id="dots" role="img" aria-label="PIN, 0 cifre su 6 inserite">
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="keypad" id="keypad">
      <button type="button" class="key" data-d="1">1</button>
      <button type="button" class="key" data-d="2">2</button>
      <button type="button" class="key" data-d="3">3</button>
      <button type="button" class="key" data-d="4">4</button>
      <button type="button" class="key" data-d="5">5</button>
      <button type="button" class="key" data-d="6">6</button>
      <button type="button" class="key" data-d="7">7</button>
      <button type="button" class="key" data-d="8">8</button>
      <button type="button" class="key" data-d="9">9</button>
      <span class="key key-empty" aria-hidden="true"></span>
      <button type="button" class="key" data-d="0">0</button>
      <button type="button" class="key key-fn" data-act="del" aria-label="Cancella ultima cifra">
        <svg viewBox="0 0 24 24" class="ico"><path d="M9 5h11a1.5 1.5 0 0 1 1.5 1.5v11A1.5 1.5 0 0 1 20 19H9l-6.2-6.4a1 1 0 0 1 0-1.4L9 5Z" fill="none" stroke-width="1.8" stroke-linejoin="round"/><path d="m12.5 10 4 4m0-4-4 4" fill="none" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════ APP ══════════════════════════════ -->
<div id="app" class="app" hidden>

  <!-- ─────────── HOME ─────────── -->
  <section id="screen-home" class="screen">
    <header class="home-head">
      <div class="home-head-text">
        <p class="greet" id="greet">Ciao</p>
        <p class="today" id="today"></p>
      </div>
      <div class="head-actions">
        <button id="themeBtn" class="icon-btn" type="button" aria-label="Cambia tema">
          <svg viewBox="0 0 24 24" class="ico ico-sun"><circle cx="12" cy="12" r="4.2"/><path d="M12 1.8v3M12 19.2v3M22.2 12h-3M4.8 12h-3M19.2 4.8l-2.1 2.1M6.9 17.1l-2.1 2.1M19.2 19.2l-2.1-2.1M6.9 6.9 4.8 4.8" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
          <svg viewBox="0 0 24 24" class="ico ico-moon"><path d="M20.5 14.5A8.6 8.6 0 0 1 9.5 3.5a8.8 8.8 0 1 0 11 11Z"/></svg>
        </button>
        <button id="lockBtn" class="icon-btn" type="button" aria-label="Blocca">
          <svg viewBox="0 0 24 24" class="ico"><rect x="4.5" y="10.5" width="15" height="10.5" rx="2.6"/><path d="M8 10.5V7.8a4 4 0 0 1 8 0v2.7" fill="none" stroke-width="2"/></svg>
        </button>
      </div>
    </header>

    <div class="services" id="services"></div>

    <p class="home-foot">
      <svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M12 2.8 4.5 6v6c0 4.6 3.2 8.3 7.5 9.3 4.3-1 7.5-4.7 7.5-9.3V6L12 2.8Z"/></svg>
      Tutti i dati restano su questo dispositivo
    </p>
  </section>

  <!-- ─────────── SERVIZIO ─────────── -->
  <section id="screen-service" class="screen screen-service" hidden>
    <header class="svc-head">
      <button id="backBtn" class="icon-btn" type="button" aria-label="Torna alla home">
        <svg viewBox="0 0 24 24" class="ico"><path d="M15 4.5 7.5 12 15 19.5" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h2 id="svcTitle" class="svc-title">Servizio</h2>
      <div id="svcTools" class="svc-tools"></div>
    </header>
    <div id="svcBody" class="svc-body"></div>
  </section>
</div>

<!-- ══════════════════════════════ MODELLO: BILANCIO ══════════════════════════════ -->
<template id="tpl-bilancio">
  <div class="bil">
    <div class="segtabs" role="tablist" aria-label="Sezioni del bilancio">
      <button class="segtab is-active" role="tab" aria-selected="true" data-view="riepilogo">Riepilogo</button>
      <button class="segtab" role="tab" aria-selected="false" data-view="movimenti">Movimenti</button>
      <button class="segtab" role="tab" aria-selected="false" data-view="impostazioni">Opzioni</button>
    </div>

    <!-- RIEPILOGO -->
    <section data-view-panel="riepilogo" class="view">
      <div class="monthbar">
        <button class="icon-btn" data-act="prevMonth" type="button" aria-label="Mese precedente">
          <svg viewBox="0 0 24 24" class="ico"><path d="M15 4.5 7.5 12 15 19.5" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <h3 data-el="monthLabel" class="month-label" aria-live="polite">—</h3>
        <button class="icon-btn" data-act="nextMonth" type="button" aria-label="Mese successivo">
          <svg viewBox="0 0 24 24" class="ico"><path d="M9 4.5 16.5 12 9 19.5" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="btn-ghost" data-act="today" type="button">Oggi</button>
      </div>

      <div class="hero card">
        <div class="hero-head">
          <span class="label">Saldo del mese</span>
          <span class="delta" data-el="heroDelta"></span>
        </div>
        <div class="hero-figure" data-el="heroSaldo">—</div>
        <div class="hero-sub" data-el="heroSub"></div>
      </div>

      <div class="kpi-row">
        <div class="card stat">
          <div class="stat-head"><span class="swatch swatch-in"></span><span class="label">Entrate</span></div>
          <div class="stat-value" data-el="kpiIn">—</div>
          <div class="stat-sub" data-el="kpiInSub"></div>
        </div>
        <div class="card stat">
          <div class="stat-head"><span class="swatch swatch-out"></span><span class="label">Uscite</span></div>
          <div class="stat-value" data-el="kpiOut">—</div>
          <div class="stat-sub" data-el="kpiOutSub"></div>
        </div>
        <div class="card stat">
          <div class="stat-head"><span class="label">Risparmio</span></div>
          <div class="stat-value" data-el="kpiRate">—</div>
          <div class="stat-sub" data-el="kpiRateSub">quota di entrate non spesa</div>
        </div>
      </div>

      <div class="card chart-card">
        <div class="card-head">
          <div>
            <h4 class="card-title">Ultimi 12 mesi</h4>
            <p class="card-note">Entrate e uscite per mese</p>
          </div>
          <div class="card-tools">
            <div class="legend">
              <span class="legend-item"><span class="swatch swatch-in"></span>Entrate</span>
              <span class="legend-item"><span class="swatch swatch-out"></span>Uscite</span>
            </div>
            <button class="btn-ghost btn-table" type="button" data-table="trend">Tabella</button>
          </div>
        </div>
        <div class="chart-scroll"><div data-el="chartTrend" class="chart"></div></div>
        <div data-el="tableTrend" class="table-view" hidden></div>
      </div>

      <div class="card chart-card">
        <div class="card-head">
          <div>
            <h4 class="card-title">Entrate per categoria</h4>
            <p class="card-note" data-el="noteCatIn">Mese corrente</p>
          </div>
          <button class="btn-ghost btn-table" type="button" data-table="catIn">Tabella</button>
        </div>
        <div data-el="chartCatIn" class="chart"></div>
        <div data-el="tableCatIn" class="table-view" hidden></div>
      </div>

      <div class="card chart-card">
        <div class="card-head">
          <div>
            <h4 class="card-title">Uscite per categoria</h4>
            <p class="card-note" data-el="noteCatOut">Mese corrente</p>
          </div>
          <button class="btn-ghost btn-table" type="button" data-table="catOut">Tabella</button>
        </div>
        <div data-el="chartCatOut" class="chart"></div>
        <div data-el="tableCatOut" class="table-view" hidden></div>
      </div>

      <div class="card">
        <div class="card-head">
          <h4 class="card-title">Ultimi movimenti</h4>
          <button class="btn-ghost" type="button" data-goto="movimenti">Vedi tutti</button>
        </div>
        <div data-el="recentList" class="list"></div>
      </div>
    </section>

    <!-- MOVIMENTI -->
    <section data-view-panel="movimenti" class="view" hidden>
      <div class="card filters">
        <div class="filter-row">
          <label class="field">
            <span class="field-label">Periodo</span>
            <select data-el="fPeriod">
              <option value="month">Mese selezionato</option>
              <option value="year">Anno corrente</option>
              <option value="all">Tutto</option>
            </select>
          </label>
          <label class="field">
            <span class="field-label">Tipo</span>
            <select data-el="fType">
              <option value="all">Tutti</option>
              <option value="entrata">Solo entrate</option>
              <option value="uscita">Solo uscite</option>
            </select>
          </label>
          <label class="field">
            <span class="field-label">Categoria</span>
            <select data-el="fCat"><option value="all">Tutte</option></select>
          </label>
          <label class="field field-grow">
            <span class="field-label">Cerca</span>
            <input data-el="fSearch" type="search" placeholder="nota o categoria…" autocomplete="off">
          </label>
        </div>
        <div class="filter-summary" data-el="filterSummary"></div>
      </div>
      <div class="card"><div data-el="fullList" class="list"></div></div>
    </section>

    <!-- OPZIONI -->
    <section data-view-panel="impostazioni" class="view" hidden>
      <div class="card">
        <h4 class="card-title">Backup dei dati</h4>
        <p class="card-note">
          I movimenti sono salvati solo nel browser di questo dispositivo. Non vengono inviati da nessuna parte,
          ma <strong>si perdono se cancelli i dati del browser</strong>. Esporta un backup ogni tanto e usalo
          anche per spostare i dati tra PC e telefono.
        </p>
        <div class="btn-row">
          <button class="btn btn-primary" data-act="export" type="button">Esporta backup (.json)</button>
          <button class="btn" data-act="import" type="button">Importa backup</button>
          <button class="btn" data-act="csv" type="button">Esporta CSV</button>
          <input type="file" data-el="importFile" accept="application/json,.json" hidden>
        </div>
        <p class="card-note" data-el="storageInfo"></p>
      </div>

      <div class="card">
        <h4 class="card-title">Categorie</h4>
        <p class="card-note">Personalizza le voci del modulo di inserimento.</p>
        <div class="cat-editor">
          <div>
            <div class="cat-editor-head"><span class="swatch swatch-in"></span><h5>Entrate</h5></div>
            <div class="chips" data-el="catsIn"></div>
            <form class="add-cat" data-kind="entrata">
              <input type="text" placeholder="Nuova categoria" maxlength="28" required>
              <button class="btn btn-sm" type="submit">Aggiungi</button>
            </form>
          </div>
          <div>
            <div class="cat-editor-head"><span class="swatch swatch-out"></span><h5>Uscite</h5></div>
            <div class="chips" data-el="catsOut"></div>
            <form class="add-cat" data-kind="uscita">
              <input type="text" placeholder="Nuova categoria" maxlength="28" required>
              <button class="btn btn-sm" type="submit">Aggiungi</button>
            </form>
          </div>
        </div>
      </div>

      <div class="card card-danger">
        <h4 class="card-title">Zona pericolosa</h4>
        <p class="card-note">Cancella definitivamente tutti i movimenti e le categorie personalizzate.</p>
        <button class="btn btn-danger" data-act="wipe" type="button">Cancella tutti i dati</button>
      </div>
    </section>

    <button class="fab" data-act="add" type="button" aria-label="Aggiungi movimento">
      <svg viewBox="0 0 24 24" class="ico"><path d="M12 5v14M5 12h14" fill="none" stroke-width="2.4" stroke-linecap="round"/></svg>
      <span class="fab-text">Aggiungi</span>
    </button>
  </div>
</template>

<!-- ══════════════════════════════ MODELLO: CALENDARIO ══════════════════════════════ -->
<template id="tpl-calendario">
  <div class="cal">
    <div class="segtabs" role="tablist" aria-label="Sezioni del calendario">
      <button class="segtab is-active" role="tab" aria-selected="true" data-view="mese">Mese</button>
      <button class="segtab" role="tab" aria-selected="false" data-view="agenda">Agenda</button>
      <button class="segtab" role="tab" aria-selected="false" data-view="opzioni">Opzioni</button>
    </div>

    <!-- MESE -->
    <section data-view-panel="mese" class="view">
      <div class="monthbar">
        <button class="icon-btn" data-act="prevMonth" type="button" aria-label="Mese precedente">
          <svg viewBox="0 0 24 24" class="ico"><path d="M15 4.5 7.5 12 15 19.5" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <h3 data-el="monthLabel" class="month-label" aria-live="polite">—</h3>
        <button class="icon-btn" data-act="nextMonth" type="button" aria-label="Mese successivo">
          <svg viewBox="0 0 24 24" class="ico"><path d="M9 4.5 16.5 12 9 19.5" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="btn-ghost" data-act="today" type="button">Oggi</button>
      </div>

      <div class="card cal-card">
        <div class="cal-dow" aria-hidden="true">
          <span>lun</span><span>mar</span><span>mer</span><span>gio</span><span>ven</span><span>sab</span><span>dom</span>
        </div>
        <div class="cal-grid" data-el="grid" role="grid" aria-label="Griglia del mese"></div>
        <div class="cal-legend">
          <span class="legend-item"><span class="ev-dot t-appuntamento"></span>Appuntamento</span>
          <span class="legend-item"><span class="ev-dot t-compleanno"></span>Compleanno</span>
          <span class="legend-item"><span class="ev-dot t-promemoria"></span>Promemoria</span>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <h4 class="card-title" data-el="dayTitle">Giorno</h4>
          <button class="btn-ghost" data-act="addOnDay" type="button">Aggiungi qui</button>
        </div>
        <div data-el="dayList" class="ev-list"></div>
      </div>
    </section>

    <!-- AGENDA -->
    <section data-view-panel="agenda" class="view" hidden>
      <div class="card filters">
        <div class="filter-row">
          <label class="field">
            <span class="field-label">Mostra</span>
            <select data-el="fRange">
              <option value="30">Prossimi 30 giorni</option>
              <option value="90">Prossimi 3 mesi</option>
              <option value="365">Prossimo anno</option>
            </select>
          </label>
          <label class="field">
            <span class="field-label">Tipo</span>
            <select data-el="fType">
              <option value="all">Tutti</option>
              <option value="appuntamento">Appuntamenti</option>
              <option value="compleanno">Compleanni</option>
              <option value="promemoria">Promemoria</option>
            </select>
          </label>
          <label class="field field-grow">
            <span class="field-label">Cerca</span>
            <input data-el="fSearch" type="search" placeholder="titolo o nota…" autocomplete="off">
          </label>
        </div>
        <div class="filter-summary" data-el="agendaSummary"></div>
      </div>
      <div class="card"><div data-el="agendaList" class="ev-list"></div></div>
    </section>

    <!-- OPZIONI -->
    <section data-view-panel="opzioni" class="view" hidden>
      <div class="card">
        <h4 class="card-title">Sveglie sul telefono</h4>
        <p class="card-note">
          Un sito web non può far suonare promemoria a telefono chiuso: è un limite delle
          piattaforme, non dell'app. La via affidabile è passare l'evento al
          <strong>calendario del telefono</strong>, che poi suona da solo — anche offline.
          Trovi il pulsante dentro ogni evento.
        </p>
        <div class="btn-row">
          <button class="btn btn-primary" data-act="icsAll" type="button">Esporta tutti gli eventi (.ics)</button>
        </div>
        <p class="card-note" data-el="notifState"></p>
        <div class="btn-row">
          <button class="btn" data-act="askNotif" type="button">Attiva avvisi nell'app</button>
        </div>
        <p class="card-note">
          Gli avvisi nell'app compaiono mentre il sito è aperto e, alla riapertura, ti segnalano
          i promemoria scaduti nel frattempo.
        </p>
      </div>

      <div class="card">
        <h4 class="card-title">Preferenze</h4>
        <label class="field">
          <span class="field-label">Orario per gli eventi "tutto il giorno"</span>
          <input data-el="defTime" type="time" value="09:00">
        </label>
        <p class="card-note">Le sveglie degli eventi senza orario si calcolano a partire da qui.</p>
      </div>

      <div class="card">
        <h4 class="card-title">Backup dei dati</h4>
        <p class="card-note">Gli eventi sono salvati solo su questo dispositivo. Esporta un backup per non perderli e per spostarli tra PC e telefono.</p>
        <div class="btn-row">
          <button class="btn btn-primary" data-act="export" type="button">Esporta backup (.json)</button>
          <button class="btn" data-act="import" type="button">Importa backup</button>
          <input type="file" data-el="importFile" accept="application/json,.json" hidden>
        </div>
        <p class="card-note" data-el="storageInfo"></p>
      </div>

      <div class="card card-danger">
        <h4 class="card-title">Zona pericolosa</h4>
        <p class="card-note">Cancella definitivamente tutti gli eventi di questo dispositivo.</p>
        <button class="btn btn-danger" data-act="wipe" type="button">Cancella tutti gli eventi</button>
      </div>
    </section>

    <button class="fab" data-act="add" type="button" aria-label="Aggiungi evento">
      <svg viewBox="0 0 24 24" class="ico"><path d="M12 5v14M5 12h14" fill="none" stroke-width="2.4" stroke-linecap="round"/></svg>
      <span class="fab-text">Aggiungi</span>
    </button>
  </div>
</template>

<!-- Modulo evento -->
<dialog id="evSheet" class="sheet">
  <form id="evForm">
    <div class="sheet-head">
      <h3 id="evTitle">Nuovo evento</h3>
      <button type="button" class="icon-btn" id="evClose" aria-label="Chiudi">
        <svg viewBox="0 0 24 24" class="ico"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div class="segmented seg-3" role="radiogroup" aria-label="Tipo di evento">
      <button type="button" class="seg is-active" data-tipo="appuntamento" role="radio" aria-checked="true">
        <svg viewBox="0 0 24 24" class="ico"><rect x="3.5" y="5" width="17" height="15.5" rx="2.6" fill="none" stroke-width="1.9"/><path d="M8 3v4M16 3v4M3.5 10h17" fill="none" stroke-width="1.9" stroke-linecap="round"/></svg>
        Appunt.
      </button>
      <button type="button" class="seg" data-tipo="compleanno" role="radio" aria-checked="false">
        <svg viewBox="0 0 24 24" class="ico"><path d="M4 20.5h16v-6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v6Z" fill="none" stroke-width="1.9" stroke-linejoin="round"/><path d="M12 12.5v-4M12 5.5a1.5 1.5 0 1 1 0 3" fill="none" stroke-width="1.9" stroke-linecap="round"/></svg>
        Compleanno
      </button>
      <button type="button" class="seg" data-tipo="promemoria" role="radio" aria-checked="false">
        <svg viewBox="0 0 24 24" class="ico"><path d="M12 3.5a6 6 0 0 0-6 6v4l-1.6 3h15.2L18 13.5v-4a6 6 0 0 0-6-6Z" fill="none" stroke-width="1.9" stroke-linejoin="round"/><path d="M10 19.5a2 2 0 0 0 4 0" fill="none" stroke-width="1.9" stroke-linecap="round"/></svg>
        Promem.
      </button>
    </div>

    <label class="field">
      <span class="field-label">Titolo</span>
      <input id="evName" type="text" maxlength="70" placeholder="es. dentista" required autocomplete="off">
    </label>

    <div class="two-col">
      <label class="field">
        <span class="field-label">Data</span>
        <input id="evDate" type="date" required>
      </label>
      <label class="field">
        <span class="field-label">Ripeti</span>
        <select id="evRepeat">
          <option value="nessuna">Mai</option>
          <option value="annuale">Ogni anno</option>
          <option value="mensile">Ogni mese</option>
          <option value="settimanale">Ogni settimana</option>
        </select>
      </label>
    </div>

    <label class="switch-row">
      <span class="field-label">Tutto il giorno</span>
      <input id="evAllDay" type="checkbox" class="switch">
    </label>

    <div class="two-col" id="evTimeRow">
      <label class="field">
        <span class="field-label">Ora</span>
        <input id="evTime" type="time" value="09:00">
      </label>
      <label class="field">
        <span class="field-label">Durata</span>
        <select id="evDur">
          <option value="0">Nessuna</option>
          <option value="15">15 minuti</option>
          <option value="30">30 minuti</option>
          <option value="60" selected>1 ora</option>
          <option value="90">1 ora e mezza</option>
          <option value="120">2 ore</option>
          <option value="180">3 ore</option>
          <option value="480">Mezza giornata</option>
        </select>
      </label>
    </div>

    <div class="field">
      <span class="field-label">Sveglie <span class="opt">(puoi sceglierne più di una)</span></span>
      <div class="alarm-grid" id="evAlarms"></div>
    </div>

    <label class="field">
      <span class="field-label">Nota <span class="opt">(facoltativa)</span></span>
      <input id="evNote" type="text" maxlength="120" placeholder="es. portare le lastre" autocomplete="off">
    </label>

    <p class="form-error" id="evError" hidden></p>

    <button type="button" class="btn btn-ics" id="evIcs" hidden>
      <svg viewBox="0 0 24 24" class="ico"><path d="M12 3.5v11m0 0 4-4m-4 4-4-4" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 16.5v2a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-2" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
      Aggiungi al calendario del telefono
    </button>

    <div class="sheet-actions">
      <button type="button" class="btn btn-danger-ghost" id="evDelete" hidden>Elimina</button>
      <span class="spacer"></span>
      <button type="button" class="btn" id="evCancel">Annulla</button>
      <button type="submit" class="btn btn-primary" id="evSave">Salva</button>
    </div>
  </form>
</dialog>

<!-- Modulo di inserimento: fuori dagli screen, così il top layer resta pulito -->
<dialog id="sheet" class="sheet">
  <form id="txForm">
    <div class="sheet-head">
      <h3 id="sheetTitle">Nuovo movimento</h3>
      <button type="button" class="icon-btn" id="closeSheet" aria-label="Chiudi">
        <svg viewBox="0 0 24 24" class="ico"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div class="segmented" role="radiogroup" aria-label="Tipo di movimento">
      <button type="button" class="seg is-active" data-kind="entrata" role="radio" aria-checked="true"><span class="seg-sign">+</span> Entrata</button>
      <button type="button" class="seg" data-kind="uscita" role="radio" aria-checked="false"><span class="seg-sign">−</span> Uscita</button>
    </div>

    <label class="field amount-field">
      <span class="field-label">Importo</span>
      <div class="amount-wrap">
        <span class="cur">€</span>
        <input id="fAmount" type="text" inputmode="decimal" placeholder="0,00" required autocomplete="off">
      </div>
    </label>

    <div class="two-col">
      <label class="field">
        <span class="field-label">Data</span>
        <input id="fDate" type="date" required>
      </label>
      <label class="field">
        <span class="field-label">Categoria</span>
        <select id="fCategory" required></select>
      </label>
    </div>

    <label class="field">
      <span class="field-label">Nota <span class="opt">(facoltativa)</span></span>
      <input id="fNote" type="text" maxlength="80" placeholder="es. stipendio settembre" autocomplete="off">
    </label>

    <p class="form-error" id="formError" hidden></p>

    <div class="sheet-actions">
      <button type="button" class="btn btn-danger-ghost" id="deleteTx" hidden>Elimina</button>
      <span class="spacer"></span>
      <button type="button" class="btn" id="cancelTx">Annulla</button>
      <button type="submit" class="btn btn-primary" id="saveTx">Salva</button>
    </div>
  </form>
</dialog>

<div id="tip" class="tip" hidden></div>
<div id="toast" class="toast" hidden></div>

<script src="js/shell.js"></script>
<script src="js/bilancio.js"></script>
<script src="js/calendario.js"></script>
</body>
</html>
